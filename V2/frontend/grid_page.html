<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grab&amp;Go — Menu</title>
  <link rel="stylesheet" href="styles/qb.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <nav class="qb-nav">
    <div class="qb-logo"><a href="home_page.html">GRAB<em>&amp;</em>GO</a></div>
    <div class="qb-nav-links">
      <a href="grid_page.html" class="active">Menu</a>
      <a href="my_cart.html">My Token</a>
      <a href="seller_dashboard.html">Seller</a>
    </div>
    <div class="qb-nav-right">
      <span id="loggin_status" class="qb-user">Guest</span>
      <a href="my_cart.html" class="qb-cart">CART</a>
    </div>
  </nav>

  <div class="qb-blocks">
    <div class="qb-block-tab active">A Block · Tandoor &amp; Grill</div>
    <div class="qb-block-tab">B Block · South Express</div>
    <div class="qb-block-tab">C Block · Chai &amp; Chaat</div>
  </div>

  <div class="qb-menu">
    <div id="game_container_id" class="qb-grid"></div>
    <button class="qb-load-more" onclick="loadMore()" style="margin-left: 0; display:block; margin-top: 30px;">LOAD MORE</button>
  </div>

  <script type="module">
    import { addHTMLToBody } from './components/create_html_elements.js';
    import { setupPopupAnimation } from './components/animate_popup.js';

    const batchSize = 6;
    let startingRow = 0;

    async function loadMore() {
      const resp = await fetch('/list_of_items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          list_fav_category: JSON.parse(localStorage.getItem('favourite_category')||'[]'),
          starting_row: startingRow,
          number_of_row: batchSize
        })
      });
      const items = await resp.json();

      items.forEach((item, idx) => {
        const i = startingRow + idx;
        addHTMLToBody(
          'game_container_id',
          `image-button_${i}`,
          `custom-content_${i}`,
          item.img,
          item.title,
          item.price,
          item.description,
          item.id
        );
        setupPopupAnimation(`image-button_${i}`, `custom-content_${i}`);
      });

      startingRow += batchSize;
    }

    window.loadMore = loadMore;
    loadMore();
  </script>

  <script>
    async function postData(endpoint_url, data) {
      const resp = await fetch(endpoint_url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      return resp.json();
    }
    (function showStatus() {
      const user_name = localStorage.getItem('email') || '';
      if (user_name.length > 1) {
        document.getElementById('loggin_status').innerText = `Welcome ${user_name}`;
      }
    })();
  </script>
</body>
</html>
