<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grab&amp;Go — My Token</title>
  <link rel="stylesheet" href="styles/qb.css" />
</head>
<body>
  <nav class="qb-nav">
    <div class="qb-logo"><a href="home_page.html">GRAB<em>&amp;</em>GO</a></div>
    <div class="qb-nav-links">
      <a href="grid_page.html">Menu</a>
      <a href="my_cart.html" class="active">My Token</a>
      <a href="seller_dashboard.html">Seller</a>
    </div>
    <div class="qb-nav-right">
      <span id="loggin_status" class="qb-user">Guest</span>
    </div>
  </nav>

  <div class="qb-cart-wrap">
    <h1 class="qb-cart-title">My Token</h1>
    <p class="qb-cart-sub">Confirm to lock in your pickup number.</p>
    <ul id="cart-list"></ul>
    <p id="split-note" style="font-size:12.5px; color:#8a8370; text-align:center; margin: -4px 0 14px;"></p>
    <button id="orderBtn" onclick="startPayment()">Confirm order</button>
  </div>

  <div id="toast">Token confirmed — head to your block when it's called!</div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script type="module" src="cart.js"></script>

  <script>
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    async function postJSON(endpoint, data) {
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return resp.json();
    }

    async function startPayment() {
      const email_name = localStorage.getItem('email');
      if (!email_name) {
        window.location.href = 'login.html';
        return;
      }

      const orderBtn = document.getElementById('orderBtn');
      orderBtn.disabled = true;
      orderBtn.textContent = 'Preparing payment…';

      try {
        const order = await postJSON('/create_order', { email_name });
        if (!order.success) {
          showToast(order.error || 'Could not start payment');
          return;
        }

        document.getElementById('split-note').textContent =
          `Paying ₹${order.amount_paid_online.toFixed(2)} now · ₹${order.amount_due_at_counter.toFixed(2)} due at the counter`;

        const options = {
          key: order.key_id,
          amount: order.amount,
          currency: order.currency,
          name: 'Grab&Go',
          description: `Booking payment (50%) — ₹${order.amount_due_at_counter.toFixed(2)} due at counter`,
          order_id: order.order_id,
          handler: async function (response) {
            const verify = await postJSON('/verify_payment', {
              email_name,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            });
            if (verify.success) {
              showToast(`Token confirmed — pay ₹${order.amount_due_at_counter.toFixed(2)} at the counter!`);
              setTimeout(() => window.location.reload(), 2000);
            } else {
              showToast('Payment could not be verified.');
            }
          },
          modal: {
            ondismiss: function () {
              showToast('Payment cancelled.');
            }
          },
          prefill: { email: email_name },
          theme: { color: '#d64545' }
        };

        const rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        console.error(err);
        showToast('Something went wrong starting payment.');
      } finally {
        orderBtn.disabled = false;
        orderBtn.textContent = 'Confirm order';
      }
    }
  </script>

  <script type="module">
    import { loadCartItems } from './cart.js';
  </script>

  <script>
    (function showStatus() {
      const user_name = localStorage.getItem('email') || '';
      if (user_name.length > 1) {
        document.getElementById('loggin_status').innerText = `Welcome ${user_name}`;
      }
    })();
  </script>
</body>
</html>
